name: Product Editorial Showcase checks
on:
  push:
    branches: [main, feat/reference-engine-v1]
  pull_request:
    branches: [main]
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: |
          node --check app.js
          node --check config.js
      - name: Contract checks
        run: node tests/contracts.mjs
