<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Editorial Motion LAB</title><link rel="stylesheet" href="styles.css"><style>body{overflow:auto;background:#111;color:#eee}.lab{min-height:100vh;padding:32px}.lab h1{font-size:clamp(34px,5vw,72px);margin:60px 0 20px}.lab-grid{display:grid;grid-template-columns:minmax(300px,1fr) minmax(260px,360px);gap:28px}.preview{position:relative;min-height:620px;background:#e9e9e5;overflow:hidden;color:#111}.preview .hero{position:absolute}.panel{background:#1c1c1c;padding:20px}.panel label{display:grid;grid-template-columns:1fr 80px;gap:12px;margin:14px 0;font-size:12px}.panel input{width:100%}.panel button,.back{display:inline-block;padding:11px 14px;border:1px solid #555;background:#222;color:white;text-decoration:none;margin:5px 6px 5px 0}.readout{font-family:monospace;font-size:12px;line-height:1.7;padding:14px;background:#0b0b0b;margin-top:16px}@media(max-width:900px){.lab-grid{grid-template-columns:1fr}}</style></head><body><div class="lab"><a class="back" href="index.html">← Experience</a><h1>Motion LAB</h1><p>Isolated tuning surface for the master transition. Changes are temporary until copied into config.</p><div class="lab-grid"><div class="preview"><section class="hero"><div class="ambient"></div><div class="word-track"><div class="word word-a" id="word-a">Glasses</div><div class="word word-b" id="word-b">Sunglasses</div></div><div class="meta meta-left"><span id="kicker">Optical collection</span><strong id="index-label">01 / 02</strong></div><div class="meta meta-right"><p id="description">A precise frame study built around proportion, light and restraint.</p></div><div class="stage-wrap"><div class="pedestal"><div class="pedestal-top"></div><div class="pedestal-front"></div><div class="pedestal-side"></div></div><div class="product-layer" id="product-layer"></div></div><div class="controls"><button id="prev">←</button><span>LAB</span><button id="next">→</button></div></section></div><aside class="panel"><h2>Timeline</h2><label>Duration <input id="duration" type="range" min="0.7" max="1.8" step="0.05" value="1.15"><output>1.15</output></label><label>Copy cue <input id="copyCue" type="range" min="0.1" max="0.9" step="0.01" value="0.46"><output>0.46</output></label><label>Product cue <input id="productCue" type="range" min="0.1" max="0.9" step="0.01" value="0.50"><output>0.50</output></label><label>Settle cue <input id="settleCue" type="range" min="0.4" max="1.1" step="0.01" value="0.82"><output>0.82</output></label><button id="play">Play transition</button><button id="reset">Reset values</button><div class="readout" id="readout"></div></aside></div></div><script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script><script src="config.js"></script><script src="app.js"></script><script>const ids=['duration','copyCue','productCue','settleCue'];function sync(){ids.forEach(id=>{const el=document.getElementById(id),v=+el.value;ProductShowcaseConfig.motion[id]=v;el.nextElementSibling.value=v.toFixed(2)});document.getElementById('readout').textContent=JSON.stringify(ProductShowcaseConfig.motion,null,2)}ids.forEach(id=>document.getElementById(id).addEventListener('input',sync));document.getElementById('play').onclick=()=>ProductEditorialEngine.step(1);document.getElementById('reset').onclick=()=>location.reload();sync();</script></body></html>
