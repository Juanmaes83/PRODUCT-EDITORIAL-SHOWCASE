<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product Editorial Studio</title><style>*{box-sizing:border-box}body{margin:0;background:#0f0f0f;color:#eee;font-family:Arial,sans-serif}.shell{min-height:100vh;display:grid;grid-template-columns:300px 1fr}.side{padding:26px;border-right:1px solid #2b2b2b}.side a{color:white}.side h1{font-size:26px}.tabs button{width:100%;text-align:left;margin:6px 0;padding:12px;background:#191919;color:white;border:1px solid #333}.main{padding:32px;max-width:1000px}.card{border:1px solid #2d2d2d;background:#171717;padding:22px;margin-bottom:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:grid;gap:7px}.field label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#aaa}.field input,.field textarea,.field select{width:100%;padding:11px;background:#0d0d0d;border:1px solid #363636;color:white}.field textarea{min-height:90px}.actions{display:flex;gap:10px;margin-top:18px}.actions button{padding:12px 18px;border:1px solid #444;background:#eee;color:#111;cursor:pointer}.status{font:12px monospace;color:#9f9;margin-top:10px}.preview{margin-top:18px;padding:18px;border:1px dashed #444}.code{white-space:pre-wrap;background:#090909;padding:14px;font:12px/1.55 monospace}@media(max-width:760px){.shell{grid-template-columns:1fr}.side{border-right:0;border-bottom:1px solid #2b2b2b}.grid{grid-template-columns:1fr}}</style></head><body><div class="shell"><aside class="side"><a href="index.html">← Experience</a><h1>Studio</h1><p>Edit product storytelling and motion without rewriting the engine.</p><div class="tabs"><button data-i="0">01 · Glasses</button><button data-i="1">02 · Sunglasses</button></div><a href="lab.html">Open Motion LAB →</a></aside><main class="main"><div class="card"><h2 id="heading">Category 01</h2><div class="grid"><div class="field"><label>Editorial title</label><input id="title"></div><div class="field"><label>Kicker</label><input id="kicker"></div><div class="field"><label>Index label</label><input id="index"></div><div class="field"><label>Product name</label><input id="name"></div><div class="field" style="grid-column:1/-1"><label>Description</label><textarea id="description"></textarea></div></div><div class="actions"><button id="save">Save locally</button><button id="reset">Reset local edits</button></div><div class="status" id="status">Ready.</div></div><div class="card"><h2>Motion</h2><div class="grid"><div class="field"><label>Autoplay ms</label><input id="auto" type="number" min="1500" step="100"></div><div class="field"><label>Copy cue</label><input id="copy" type="number" step="0.01"></div><div class="field"><label>Product cue</label><input id="product" type="number" step="0.01"></div><div class="field"><label>Settle cue</label><input id="settle" type="number" step="0.01"></div></div></div><div class="card"><h2>Export project state</h2><div class="actions"><button id="export">Refresh JSON</button></div><pre class="code" id="json"></pre></div></main></div><script src="config.js"></script><script>const BASE=JSON.parse(JSON.stringify(ProductShowcaseConfig));const KEY='product-editorial-showcase-v1';let cfg=JSON.parse(localStorage.getItem(KEY)||'null')||BASE;let i=0;const $=id=>document.getElementById(id);const fields={title:$('title'),kicker:$('kicker'),index:$('index'),name:$('name'),description:$('description')};function load(){const c=cfg.categories[i];$('heading').textContent=`Category ${String(i+1).padStart(2,'0')}`;fields.title.value=c.title;fields.kicker.value=c.kicker;fields.index.value=c.indexLabel;fields.name.value=c.product.name;fields.description.value=c.description;$('auto').value=cfg.motion.autoplayMs;$('copy').value=cfg.motion.copyCue;$('product').value=cfg.motion.productCue;$('settle').value=cfg.motion.settleCue;show()}function show(){$('json').textContent=JSON.stringify(cfg,null,2)}document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{i=+b.dataset.i;load()});$('save').onclick=()=>{const c=cfg.categories[i];c.title=fields.title.value;c.kicker=fields.kicker.value;c.indexLabel=fields.index.value;c.product.name=fields.name.value;c.description=fields.description.value;cfg.motion.autoplayMs=+$('auto').value;cfg.motion.copyCue=+$('copy').value;cfg.motion.productCue=+$('product').value;cfg.motion.settleCue=+$('settle').value;localStorage.setItem(KEY,JSON.stringify(cfg));$('status').textContent='Saved in localStorage. Export JSON to promote into config.js.';show()};$('reset').onclick=()=>{localStorage.removeItem(KEY);cfg=JSON.parse(JSON.stringify(BASE));load();$('status').textContent='Local edits reset.'};$('export').onclick=show;load();</script></body></html>
